# Run fetch_jobs.py every 5 days (04:00 UTC on days 1, 6, 11, 16, 21, 26) and commit updated public/jobs.json
name: Update Job Board

on:
  schedule:
    - cron: '0 4 1,6,11,16,21,26 * *'
  workflow_dispatch:

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch_jobs.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
        run: python3 fetch_jobs.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/jobs.json
          git diff --staged --quiet || (git commit -m "chore: update job board data" && git push)
