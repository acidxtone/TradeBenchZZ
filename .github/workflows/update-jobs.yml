# Run fetch_jobs_direct.py every 3 days (04:00 UTC on days 1, 4, 7, 10, 13, 16, 19, 22, 25, 28, 31) and commit updated public/jobs.json
name: Update Job Board

on:
  schedule:
    - cron: '0 4 1,4,7,10,13,16,19,22,25,28,31 * *'
  workflow_dispatch:

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run fetch_jobs_direct.py
        run: python3 fetch_jobs_direct.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/jobs.json
          git diff --staged --quiet || (git commit -m "chore: update job board data" && git push)
